name: SCP-JP Crom probe

on:
  workflow_dispatch:
    inputs:
      since_jst:
        description: Inclusive cutoff in ISO-8601 format with timezone
        required: true
        default: "2026-07-26T00:00:00+09:00"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULT_DIR: ${{ github.workspace }}/artifacts/scp-jp-crom-probe

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      # Create valid fallback files before Python setup or dependency installation.
      # This prevents the artifact step from hiding the original failure with
      # "No files were found with the provided path".
      - name: Prepare diagnostic outputs
        id: prepare
        if: always()
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          cat > "$RESULT_DIR/probe-result.json" <<'JSON'
          {
            "schema_version": 2,
            "status": "error",
            "error_type": "WorkflowNotCompleted",
            "error": "The workflow did not reach or complete the Crom query step. Check workflow-diagnostics.txt and probe.log."
          }
          JSON
          cat > "$RESULT_DIR/probe-summary.md" <<'MARKDOWN'
          # SCP-JP Crom probe

          - Status: **error**
          - Error: The workflow did not reach or complete the Crom query step.
          - Check `workflow-diagnostics.txt` and `probe.log` in the artifact.
          MARKDOWN
          : > "$RESULT_DIR/probe.log"
          {
            echo "generated_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workspace=${GITHUB_WORKSPACE}"
          } > "$RESULT_DIR/workflow-diagnostics.txt"

      - name: Set up Python 3.14
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Crom client
        id: install
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile probe
        id: compile
        run: python -m compileall -q scripts/scp_jp_crom_probe.py

      - name: Query Crom
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/scp_jp_crom_probe.py \
            --since-jst '${{ inputs.since_jst }}' \
            --output "$RESULT_DIR/probe-result.json" \
            --summary-output "$RESULT_DIR/probe-summary.md" \
            2>&1 | tee "$RESULT_DIR/probe.log"

      - name: Record step outcomes
        if: always()
        shell: bash
        run: |
          {
            echo "checkout_outcome=${{ steps.checkout.outcome }}"
            echo "prepare_outcome=${{ steps.prepare.outcome }}"
            echo "setup_python_outcome=${{ steps.setup_python.outcome }}"
            echo "install_outcome=${{ steps.install.outcome }}"
            echo "compile_outcome=${{ steps.compile.outcome }}"
            echo "probe_outcome=${{ steps.probe.outcome }}"
          } >> "$RESULT_DIR/workflow-diagnostics.txt"

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          cat "$RESULT_DIR/probe-summary.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "## Workflow step outcomes"
            echo
            echo '```text'
            cat "$RESULT_DIR/workflow-diagnostics.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate diagnostic files
        if: always()
        shell: bash
        run: |
          test -s "$RESULT_DIR/probe-result.json"
          test -s "$RESULT_DIR/probe-summary.md"
          test -f "$RESULT_DIR/probe.log"
          test -s "$RESULT_DIR/workflow-diagnostics.txt"

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-jp-crom-probe
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when probe failed or was skipped
        if: ${{ always() && steps.probe.outcome != 'success' }}
        run: exit 1
