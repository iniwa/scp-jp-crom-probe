name: SCP-JP Crom probe

on:
  workflow_dispatch:
    inputs:
      since_jst:
        description: Inclusive cutoff in ISO-8601 format with timezone
        required: true
        default: "2026-07-26T00:00:00+09:00"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Crom client
        run: python -m pip install --disable-pip-version-check "thaumiel==0.1.0"

      - name: Compile probe
        run: python -m compileall -q scripts/scp_jp_crom_probe.py

      - name: Query Crom
        id: probe
        continue-on-error: true
        run: |
          python scripts/scp_jp_crom_probe.py \
            --since-jst '${{ inputs.since_jst }}' \
            --output probe-result.json \
            --summary-output probe-summary.md

      - name: Add result to job summary
        if: always()
        run: |
          if [ -f probe-summary.md ]; then
            cat probe-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe did not produce a summary file.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-jp-crom-probe
          path: |
            probe-result.json
            probe-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when probe failed
        if: steps.probe.outcome != 'success'
        run: exit 1
