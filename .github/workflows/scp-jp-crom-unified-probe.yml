name: SCP-JP Crom unified probe

on:
  workflow_dispatch:
    inputs:
      since_jst:
        description: Inclusive cutoff in ISO-8601 format with timezone
        required: true
        default: "2026-07-26T00:00:00+09:00"

permissions:
  contents: read

env:
  UNIFIED_OUTPUT_DIR: unified-output

jobs:
  unified-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      # Checkout may clean untracked files from the workspace. Prepare the
      # diagnostic/output directory only after checkout so later shell
      # redirection cannot fail before Python starts.
      - name: Initialize diagnostic files
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$UNIFIED_OUTPUT_DIR"
          mkdir -p "$UNIFIED_OUTPUT_DIR/articles"
          cat > "$UNIFIED_OUTPUT_DIR/unified-result.json" <<'JSON'
          {
            "schema_version": 4,
            "status": "workflow_not_started",
            "error": "The unified probe did not overwrite this placeholder."
          }
          JSON
          cat > "$UNIFIED_OUTPUT_DIR/unified-summary.md" <<'MARKDOWN'
          # SCP-JP Crom unified probe

          The unified probe did not run. Check workflow-diagnostics.txt and step logs.
          MARKDOWN

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parser and classification tests
        id: tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_unified_parser.py' -v

      - name: Compile probe
        id: compile
        shell: bash
        run: python -m compileall -q scripts/scp_jp_crom_unified_probe.py

      - name: Query JP originals and translations through Crom
        id: query
        continue-on-error: true
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Ensure the directory exists before opening probe.log. Shell
          # redirection happens before Python starts. Without this mkdir, a
          # checkout-cleaned directory causes an immediate exit code 1 and no
          # result files.
          mkdir -p "$UNIFIED_OUTPUT_DIR/articles"
          set +e
          python scripts/scp_jp_crom_unified_probe.py \
            --since-jst '${{ inputs.since_jst }}' \
            --output-dir "$UNIFIED_OUTPUT_DIR" \
            > "$UNIFIED_OUTPUT_DIR/probe.log" 2>&1
          probe_exit=$?
          set -e

          echo "exit_code=$probe_exit" >> "$GITHUB_OUTPUT"
          echo "Probe exit code: $probe_exit"
          tail -n 40 "$UNIFIED_OUTPUT_DIR/probe.log" || true
          exit "$probe_exit"

      - name: Capture workflow diagnostics
        if: always()
        shell: bash
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          QUERY_OUTCOME: ${{ steps.query.outcome }}
          QUERY_EXIT_CODE: ${{ steps.query.outputs.exit_code }}
        run: |
          mkdir -p "$UNIFIED_OUTPUT_DIR"
          {
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "initialize_outcome=${INITIALIZE_OUTCOME:-unknown}"
            echo "checkout_outcome=${CHECKOUT_OUTCOME:-unknown}"
            echo "setup_python_outcome=${SETUP_PYTHON_OUTCOME:-unknown}"
            echo "tests_outcome=${TESTS_OUTCOME:-unknown}"
            echo "compile_outcome=${COMPILE_OUTCOME:-unknown}"
            echo "query_outcome=${QUERY_OUTCOME:-unknown}"
            echo "query_exit_code=${QUERY_EXIT_CODE:-unknown}"
          } > "$UNIFIED_OUTPUT_DIR/workflow-diagnostics.txt"

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$UNIFIED_OUTPUT_DIR/unified-summary.md" ]; then
            cat "$UNIFIED_OUTPUT_DIR/unified-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unified summary is missing." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "## Workflow step outcomes"
            echo
            echo '```text'
            cat "$UNIFIED_OUTPUT_DIR/workflow-diagnostics.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-jp-crom-unified-probe
          path: unified-output/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when probe is not fully healthy
        if: always() && steps.query.outcome != 'success'
        shell: bash
        run: exit 1
